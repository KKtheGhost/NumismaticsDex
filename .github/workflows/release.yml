name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to package
        required: true
        default: v0.0.1
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore .\NumismaticsDex.sln
      - name: Run tests
        run: dotnet test .\NumismaticsDex.Tests\NumismaticsDex.Tests.csproj -c Release --no-restore
      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content '.\NumismaticsDex.App\Package.appxmanifest'
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $expectedVersion = "$tagVersion.0"
          if ($manifest.Package.Identity.Version -ne $expectedVersion) {
            throw "Tag $env:RELEASE_TAG does not match package version $($manifest.Package.Identity.Version)."
          }
      - name: Create temporary signing certificate
        shell: pwsh
        run: .\scripts\New-DevCertificate.ps1
      - name: Package signed MSIX
        shell: pwsh
        run: .\scripts\Package.ps1
      - name: Assemble release files
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $package = Get-ChildItem '.\NumismaticsDex.App\AppPackages' -Filter 'NumismaticsDex.App_*.msix' -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $package) { throw 'The MSIX package was not generated.' }

          $releaseDirectory = Join-Path $PWD 'artifacts\release'
          $bundleDirectory = Join-Path $releaseDirectory 'bundle'
          New-Item -Path $bundleDirectory -ItemType Directory -Force | Out-Null
          Copy-Item $package.FullName (Join-Path $bundleDirectory "NumismaticsDex_${version}_x64.msix")
          Copy-Item '.\artifacts\NumismaticsDex_Dev.cer' (Join-Path $bundleDirectory "NumismaticsDex_${version}.cer")

          $dependencies = Join-Path $package.DirectoryName 'Dependencies\x64'
          if (Test-Path $dependencies) {
            $releaseDependencies = Join-Path $bundleDirectory 'Dependencies\x64'
            New-Item -Path $releaseDependencies -ItemType Directory -Force | Out-Null
            Copy-Item (Join-Path $dependencies '*') $releaseDependencies -Recurse -Force
          }

          Copy-Item (Join-Path $bundleDirectory "NumismaticsDex_${version}_x64.msix") $releaseDirectory
          Copy-Item (Join-Path $bundleDirectory "NumismaticsDex_${version}.cer") $releaseDirectory
          Compress-Archive -Path (Join-Path $bundleDirectory '*') -DestinationPath (Join-Path $releaseDirectory "NumismaticsDex_${version}_x64.zip") -Force
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: NumismaticsDex ${{ inputs.tag_name || github.ref_name }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          prerelease: true
          files: |
            artifacts/release/NumismaticsDex_*_x64.msix
            artifacts/release/NumismaticsDex_*.cer
            artifacts/release/NumismaticsDex_*_x64.zip