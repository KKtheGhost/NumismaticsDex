name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore .\NumismaticsDex.sln
      - name: Build WinUI app
        run: dotnet build .\NumismaticsDex.App\NumismaticsDex.App.csproj -c Release --no-restore
      - name: Test and collect production coverage
        shell: pwsh
        run: >-
          dotnet test .\NumismaticsDex.Tests\NumismaticsDex.Tests.csproj -c Release --no-restore
          /p:CollectCoverage=true
          /p:IncludeTestAssembly=true
          /p:CoverletOutput=..\coverage\
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[NumismaticsDex.Core]*%2c[NumismaticsDex.Tests]*'
          '/p:ExcludeByFile=**/*Tests.cs%2c**/TestBanknoteFactory.cs%2c**/StubHttpMessageHandler.cs%2c**/Usings.cs%2c**/.nuget/packages/**/*.cs'
      - name: Update README coverage
        if: always()
        shell: pwsh
        run: |
          $coverageFile = '.\coverage\coverage.cobertura.xml'
          if (Test-Path $coverageFile) {
            .\scripts\Update-CoverageReadme.ps1 -CoverageFile $coverageFile -Commit $env:GITHUB_SHA
          }
          else {
            'Coverage report was not produced.' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload coverage report
        if: always() && hashFiles('coverage/coverage.cobertura.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.cobertura.xml
      - name: Commit README coverage update
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'ci: update test coverage [skip ci]'
            git push
          }